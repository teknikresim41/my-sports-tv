<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><title>My Sports TV</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#f1f5f9;font:15px system-ui,Arial}.wrap{max-width:850px;margin:auto;padding:22px 15px 90px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{margin:0;font-size:27px}small,.muted{color:#9caec5}.sub{margin:6px 0 20px;color:#a7b6c9}.tabs,.filters{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.tabs button,.filters button,button{background:#1b2940;color:#e7eef8;border:1px solid #31415b;border-radius:12px;padding:10px 13px;cursor:pointer}.tabs .active,.filters .active{background:#2862df;border-color:#2862df}.panel{background:#131f32;border:1px solid #2b3c56;border-radius:17px;padding:16px;margin:12px 0}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.league{font-size:12px;letter-spacing:.7px;color:#a7b8d2;font-weight:700}.live{color:#ff7676;font-size:12px;font-weight:700}.match{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 0}.teams{font-size:17px;font-weight:700}.score{font-size:24px;font-weight:800;white-space:nowrap}.meta{font-size:13px;color:#a9bad0}.channel{color:#c8ddff;font-size:13px}.action{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:13px;flex-wrap:wrap}.action a{background:#2862df;color:white;padding:9px 13px;border-radius:10px;text-decoration:none;font-weight:650}.empty{padding:22px;text-align:center;color:#a6b8d0}.tag{background:#253851;padding:5px 9px;border-radius:20px;font-size:12px}.settings label{display:block;margin:15px 0}.settings select{background:#23344e;color:white;padding:8px;border:1px solid #435778;border-radius:9px}.hint{font-size:12px;color:#9caec5;line-height:1.6}.status{font-size:12px;color:#a7b8d2}.error{color:#ffb4b4}a{color:#a5c7ff} .langpick{display:flex;gap:5px;align-items:center}.langpick button{padding:7px 10px;font-size:12px}.langpick button.active{background:#2862df;border-color:#2862df}.info-toggle{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:0;padding:0;font-weight:700;font-size:16px}.info-mark{display:inline-grid;place-items:center;background:#fbbf24;color:#172033;width:27px;height:27px;border-radius:50%;font-size:20px;font-weight:900}.info-body{margin-top:12px;border-top:1px solid #31415b;padding-top:10px}.info-body[hidden]{display:none}.info-panel{margin-top:8px} .reminder-switch{display:flex!important;align-items:center;gap:12px;margin:14px 0!important;cursor:pointer}.reminder-switch input{width:23px;height:23px;accent-color:#3b82f6;flex-shrink:0}#reminder-options[hidden],#reminder-off-note[hidden]{display:none!important}</style></head><body><div class="wrap"><header><div><h1>🏀 My Sports TV</h1><div class="sub">NBA · EuroLeague · Galatasaray</div></div><div style="text-align:right"><div class="langpick" role="group" aria-label="Language"><button id="tr-btn" class="active" type="button">🇹🇷 Türkçe</button><button id="en-btn" type="button">🇬🇧 English</button></div><div style="margin-top:8px"><span id="timezone-label" class="tag">🇹🇷 Türkiye saati</span></div></div></header><section class="panel info-panel"><button id="info-toggle" class="info-toggle" type="button" aria-expanded="false" aria-controls="info-body"><span class="info-mark">!</span><span id="info-heading">Maç rehberim — Açıklama</span><span id="info-arrow" style="margin-left:auto">⌄</span></button><div id="info-body" class="info-body" hidden><p id="info-description" class="hint"></p><p id="info-disclaimer" class="hint"></p></div><div class="top" style="margin-top:12px"><span id="data-status-label" class="status">Veri durumu</span><span id="updated" class="status">Veri bekleniyor</span></div></section><nav class="tabs"><button class="active" data-tab="today">Bugün</button><button data-tab="week">7 Gün</button><button data-tab="live">Canlı</button><button data-tab="fixtures">Fikstür</button><button data-tab="settings">Ayarlar</button></nav><div class="filters"><button class="active" data-filter="all">Tümü</button><button data-filter="nba">NBA</button><button data-filter="euro">EuroLeague</button><button data-filter="gs">Galatasaray</button></div><main id="content"></main></div><script>
const $=s=>document.querySelector(s), state={tab:'today',filter:'all',games:[],broadcasts:[],broadcastNote:'',nbaError:'',last:null};const langText={tr:{timezone:'🇹🇷 Türkiye saati',info:'Maç rehberim — Açıklama',description:'Bu rehber NBA, EuroLeague ve Galatasaray maçlarını, mümkün olduğunda canlı skorları ve doğrulanmış yayın kanallarını bir arada gösterir. TV+ üzerindeki S Sport 77. kanal, S Sport 2 ise 78. kanaldır. Bir maça dokunarak ilgili yayın platformuna veya maç sayfasına geçebilirsiniz.',disclaimer:'Önemli: NBA skorları internet bağlantısıyla yenilenir. Galatasaray takımının açıklanmış Süper Lig ve Şampiyonlar Ligi fikstürü eklenmiştir; maç sonuçları otomatik güncellenmez. EuroLeague için tam otomatik fikstür/skor bağlantısı henüz yoktur. S Sport yayın bilgileri son doğrulanan kayıtları yansıtır; her gün otomatik güncellenmez. TV+ erişimi aboneliğinize bağlıdır. Hatırlatma saatleri kaydedilir, fakat arka plan bildirimleri henüz etkin değildir.',data:'Veri durumu',waiting:'Veri bekleniyor',checked:'Son kontrol: ',tabs:['Bugün','7 Gün','Canlı','Fikstür','Ayarlar'],filters:['Tümü','NBA','EuroLeague','Galatasaray'],scheduleChecked:'Yayın akışı kontrol tarihi: ',notAuto:' · Sonraki değişiklikler otomatik alınmıyor.',offline:'Yayın akışı: 28 Ekim 2026 tarihli kayıtlar (çevrimdışı kopya).',scheduleLink:'Güncel S Sport yayın akışı ↗',live:'● CANLI',finished:'BİTTİ',scheduled:'Canlı yayın planı',replay:'Tekrar yayın',verified:'Yayın akışında',refresh:'Skorlar otomatik yenilenir',tvOpen:'TV+ aç ↗',matchPage:'Maç sayfası ↗',notVerified:'Yayın kanalı doğrulanmadı',empty:'Bu görünümde doğrulanmış maç bulunamadı.',missing:'Galatasaray için doğrulanmış fikstürü Fikstür sekmesinde bulunuyor. Maç sonuçları otomatik bağlı değil.',nbaError:'NBA veri servisine erişilemiyor.',nbaNone:'Bu tarihlerde NBA maçı bulunamadı.',reminders:'🔔 Hatırlatmalar',reminderToggle:'Hatırlatmaları etkinleştir',reminderOff:'Hatırlatmalar kapalı. Sabah ve maç öncesi bildirimler devre dışı.',morning:'Sabah özeti:',before:'Maç öncesi:',minutes:'dakika',notify:'Bildirim izni iste',notifyNote:'Bu sürümde saat ayarları kaydedilir. Telefon kilitliyken güvenilir bildirim için sunucu ve push altyapısı gerekir; şu anda arka plan bildirimi gönderilmez.',links:'📺 Yayın bağlantıları',open:'aç ↗',channelNote:'S Sport: TV+ 77 · S Sport 2: TV+ 78. Her maçın bu kanallarda yayınlandığı anlamına gelmez.',unsupported:'Bu tarayıcı bildirim desteklemiyor.',permission:'Bildirim izni:',permissionNote:'— otomatik bildirim servisi henüz bağlı değil.'},en:{timezone:'🇹🇷 Türkiye time',info:'My Match Guide — Information',description:'This guide brings together NBA, EuroLeague and Galatasaray fixtures, live scores when available, and verified TV channels. On TV+, S Sport is channel 77 and S Sport 2 is channel 78. Open a match to visit the streaming platform or game page.',disclaimer:'Important: NBA scores refresh when online. Published Galatasaray league and Champions League fixtures are included, but scores do not update automatically. Full automatic EuroLeague fixtures/scores are not yet connected. S Sport listings reflect the last verified schedule and do not update daily. TV+ access depends on your subscription. Reminder preferences are saved, but background notifications are not yet active.',data:'Data status',waiting:'Waiting for data',checked:'Last checked: ',tabs:['Today','7 Days','Live','Fixtures','Settings'],filters:['All','NBA','EuroLeague','Galatasaray'],scheduleChecked:'Schedule checked: ',notAuto:' · Later changes are not fetched automatically.',offline:'Broadcast schedule: verified October 28, 2026 entries (offline copy).',scheduleLink:'Current S Sport TV schedule ↗',live:'● LIVE',finished:'FINAL',scheduled:'Scheduled live broadcast',replay:'Replay',verified:'In TV schedule',refresh:'Scores refresh automatically',tvOpen:'Open TV+ ↗',matchPage:'Game page ↗',notVerified:'Channel not verified',empty:'No verified games found in this view.',missing:'Verified Galatasaray fixtures are available in the Fixtures tab. Live scores are not yet connected.',nbaError:'NBA data service unavailable.',nbaNone:'No NBA games found for these dates.',reminders:'🔔 Reminders',reminderToggle:'Enable reminders',reminderOff:'Reminders are off. Morning and pre-game alerts are disabled.',morning:'Morning summary:',before:'Before game:',minutes:'minutes',notify:'Request notification permission',notifyNote:'Reminder preferences are saved. Reliable alerts when your phone is locked require a server and push service; background alerts are not active yet.',links:'📺 Watch links',open:'open ↗',channelNote:'S Sport: TV+ 77 · S Sport 2: TV+ 78. This does not mean every game is broadcast on these channels.',unsupported:'This browser does not support notifications.',permission:'Notification permission:',permissionNote:'— automated notifications are not yet connected.'}};let lang='tr';try{lang=localStorage.getItem('sports-language')==='en'?'en':'tr'}catch(e){}const t=()=>langText[lang];function setLanguage(next){lang=next;state.broadcastNote=state.broadcasts.length?t().offline:'';localStorage.setItem('sports-language',lang);document.documentElement.lang=lang;$('#tr-btn').classList.toggle('active',lang==='tr');$('#en-btn').classList.toggle('active',lang==='en');$('#timezone-label').textContent=t().timezone;$('#info-heading').textContent=t().info;$('#info-description').textContent=t().description;$('#info-disclaimer').textContent=t().disclaimer;$('#data-status-label').textContent=t().data;document.querySelectorAll('[data-tab]').forEach((b,i)=>b.textContent=t().tabs[i]);document.querySelectorAll('[data-filter]').forEach((b,i)=>b.textContent=t().filters[i]);render()}document.getElementById('tr-btn').onclick=()=>setLanguage('tr');document.getElementById('en-btn').onclick=()=>setLanguage('en');document.getElementById('info-toggle').onclick=()=>{const e=$('#info-body');e.hidden=!e.hidden;$('#info-toggle').setAttribute('aria-expanded',String(!e.hidden));$('#info-arrow').textContent=e.hidden?'⌄':'⌃'};const TZ='Europe/Istanbul';const dateTR=d=>new Intl.DateTimeFormat('tr-TR',{timeZone:TZ,day:'2-digit',month:'short',weekday:'short'}).format(d);const timeTR=d=>new Intl.DateTimeFormat('tr-TR',{timeZone:TZ,hour:'2-digit',minute:'2-digit',hour12:false}).format(d);const keyTR=d=>new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}).format(d);const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const sourceLinks={nba:'https://www.nba.com/games',euro:'https://www.euroleaguebasketball.net/euroleague/games/',gs:'https://www.galatasaray.org/'};

const EMBEDDED_SCHEDULE={"source":"https://www.ssportplus.com/yayin-akisi/","checkedAt":"2026-10-28","note":"28 Ekim 2026 tarihinde resmi S Sport Plus yayin akisindan kontrol edilen ornek kayitlar. Sonraki gunler icin otomatik guncelleme sunucusu gerekir.","broadcasts":[{"date":"2026-10-28","time":"03:00","league":"nba","title":"New York Knicks - Detroit Pistons","channel":"S Sport","number":77,"live":true},{"date":"2026-10-29","time":"02:00","league":"nba","title":"Indiana Pacers - Philadelphia 76ers","channel":"S Sport","number":77,"live":true},{"date":"2026-10-29","time":"04:30","league":"nba","title":"Dallas Mavericks - Oklahoma City Thunder","channel":"S Sport","number":77,"live":true},{"date":"2026-10-29","time":"22:45","league":"euro","title":"Real Madrid - Fenerbahçe","channel":"S Sport","number":77,"live":true},{"date":"2026-10-30","time":"05:00","league":"nba","title":"Portland Trail Blazers - Memphis Grizzlies","channel":"S Sport","number":77,"live":true},{"date":"2026-10-30","time":"19:00","league":"euro","title":"Dubai Basket - Hapoel Tel Aviv","channel":"S Sport 2","number":78,"live":true}]};
const GS_FIXTURES=[{"date":"2026-10-30","time":"20:00","away":"Konyaspor","home":"Galatasaray","competition":"Süper Lig"},{"date":"2026-11-03","time":"20:45","away":"Galatasaray","home":"VfB Stuttgart","competition":"Şampiyonlar Ligi"},{"date":"2026-11-07","time":"19:00","away":"Galatasaray","home":"Amed Sportif","competition":"Süper Lig"},{"date":"2026-11-21","time":"16:00","away":"Galatasaray","home":"Samsunspor","competition":"Süper Lig"},{"date":"2026-11-24","time":"20:45","away":"Galatasaray","home":"Aston Villa","competition":"Şampiyonlar Ligi"},{"date":"2026-11-30","time":"21:00","away":"Beşiktaş","home":"Galatasaray","competition":"Süper Lig"},{"date":"2026-12-04","time":"20:00","away":"Galatasaray","home":"Çaykur Rizespor","competition":"Süper Lig"},{"date":"2026-12-08","time":"23:00","away":"AEK Atina","home":"Galatasaray","competition":"Şampiyonlar Ligi"},{"date":"2026-12-12","time":"19:00","away":"Eyüpspor","home":"Galatasaray","competition":"Süper Lig"},{"date":"2026-12-19","time":"19:00","away":"Galatasaray","home":"Alanyaspor","competition":"Süper Lig"},{"date":"2027-01-19","time":"20:45","away":"Galatasaray","home":"Feyenoord","competition":"Şampiyonlar Ligi"},{"date":"2027-01-27","time":"23:00","away":"PSG","home":"Galatasaray","competition":"Şampiyonlar Ligi"}];
const verifiedBroadcasts=[
{date:'2026-10-28',time:'03:00',league:'nba',title:'New York Knicks - Detroit Pistons',channel:'S Sport',number:77,live:true},
{date:'2026-10-29',time:'02:00',league:'nba',title:'Indiana Pacers - Philadelphia 76ers',channel:'S Sport',number:77,live:true},
{date:'2026-10-29',time:'04:30',league:'nba',title:'Dallas Mavericks - Oklahoma City Thunder',channel:'S Sport',number:77,live:true},
{date:'2026-10-29',time:'22:45',league:'euro',title:'Real Madrid - Fenerbahçe',channel:'S Sport',number:77,live:true},
{date:'2026-10-30',time:'05:00',league:'nba',title:'Portland Trail Blazers - Memphis Grizzlies',channel:'S Sport',number:77,live:true},
{date:'2026-10-30',time:'19:00',league:'euro',title:'Dubai Basket - Hapoel Tel Aviv',channel:'S Sport 2',number:78,live:true}];
const norm=s=>String(s||'').toLocaleLowerCase('tr-TR').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
const broadcasterUrl='https://www.ssportplus.com/yayin-akisi/';
function loadBroadcasts(){const data=EMBEDDED_SCHEDULE;state.broadcasts=data.broadcasts||verifiedBroadcasts;state.broadcastNote=t().scheduleChecked+data.checkedAt+t().notAuto;render()}
function broadcastGames(){return state.broadcasts.map((b,i)=>({id:'ss-'+i,league:b.league,date:new Date(b.date+'T'+b.time+':00+03:00'),home:b.title.split(/\s+-\s+/)[1]||'',away:b.title.split(/\s+-\s+/)[0]||b.title,status:'scheduled',detail:b.live?t().scheduled:t().replay,channel:b.channel+' · TV+ '+b.number,channelVerified:true,liveBroadcast:b.live,url:'https://tvplus.com.tr/',source:broadcasterUrl}))}
function matchBroadcast(g){const dt=keyTR(g.date);return state.broadcasts.find(b=>b.league===g.league&&b.date===dt&&Math.abs(new Date(b.date+'T'+b.time+':00+03:00')-g.date)<7200000&&(norm(b.title).includes(norm(g.home).slice(0,6))||norm(b.title).includes(norm(g.away).slice(0,6))))}
function galatasarayGames(){return GS_FIXTURES.map((g,i)=>({id:'gs-'+i,league:'gs',date:new Date(g.date+'T'+g.time+':00+03:00'),away:g.away,home:g.home,status:'scheduled',detail:g.competition,channel:t().notVerified,channelVerified:false,url:'https://www.galatasaray.org/'}))}
function combinedGames(){const all=state.games.concat(galatasarayGames()).map(g=>{const b=matchBroadcast(g);return b?{...g,channel:b.channel+' · TV+ '+b.number,channelVerified:true,liveBroadcast:b.live,source:broadcasterUrl,url:'https://tvplus.com.tr/'}:g});const known=new Set(all.filter(g=>g.channelVerified).map(g=>norm(g.away+' '+g.home)+keyTR(g.date)));return all.concat(broadcastGames().filter(g=>!known.has(norm(g.away+' '+g.home)+keyTR(g.date)))).sort((a,b)=>a.date-b.date)}

async function getNBA(){let games=[];let errors=[];for(let offset=-1;offset<=7;offset++){const d=new Date(Date.now()+offset*86400000);const ymd=new Intl.DateTimeFormat('en-CA',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit'}).format(d).replaceAll('-','');try{const ctrl=new AbortController();const timeout=setTimeout(()=>ctrl.abort(),6500);const r=await fetch('https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard?dates='+ymd,{signal:ctrl.signal});clearTimeout(timeout);if(!r.ok)throw Error('HTTP '+r.status);const data=await r.json();for(const e of data.events||[]){const c=e.competitions?.[0];const teams=c?.competitors||[];const home=teams.find(t=>t.homeAway==='home'),away=teams.find(t=>t.homeAway==='away');if(!home||!away)continue;const st=e.status?.type||{};games.push({id:e.id,league:'nba',date:new Date(e.date),home:home.team?.displayName||'',away:away.team?.displayName||'',homeScore:home.score,awayScore:away.score,status:st.state==='in'?'live':st.completed?'final':'scheduled',detail:e.status?.displayClock&&st.state==='in'?(e.status.period+'. Çeyrek · '+e.status.displayClock):st.shortDetail||'',channel:t().notVerified,url:sourceLinks.nba})}}catch(e){errors.push(e.message)}}state.nbaError=games.length?'':errors.length?t().nbaError:t().nbaNone;state.games=[...new Map(games.map(g=>[g.id,g])).values()].sort((a,b)=>a.date-b.date);state.last=new Date();render()}
function card(g){return `<article class="panel"><div class="top"><span class="league">${g.league==='nba'?'🏀 NBA':g.league==='euro'?'🏀 EUROLEAGUE':'⚽ GALATASARAY · '+escapeHtml(g.detail)}</span><span class="${g.status==='live'?'live':'meta'}">${g.status==='live'?t().live+' · '+escapeHtml(g.detail):g.status==='final'?t().finished:'🕒 '+dateTR(g.date)+' '+timeTR(g.date)}</span></div><div class="match"><div class="teams">${escapeHtml(g.away)}<br>${escapeHtml(g.home)}</div><div class="score">${g.status==='scheduled'?'–':escapeHtml(g.awayScore)+' – '+escapeHtml(g.homeScore)}</div></div><div class="channel">📺 ${escapeHtml(g.channel)} ${g.channelVerified?'<span class="tag">'+t().verified+'</span>':''}</div><div class="action"><span class="meta">${g.status==='live'?t().refresh:escapeHtml(g.detail)}</span><a href="${g.url}" target="_blank" rel="noopener noreferrer">${g.channelVerified?t().tvOpen:t().matchPage}</a></div></article>`}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab));document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('active',b.dataset.filter===state.filter));$('.filters').style.display=state.tab==='settings'?'none':'flex';$('#updated').textContent=state.last?t().checked+timeTR(state.last):t().waiting;if(state.tab==='settings'){renderSettings();return}const now=new Date(),today=keyTR(now),weekEnd=new Date(now.getTime()+7*86400000);const filtered=combinedGames().filter(g=>(state.filter==='all'||g.league===state.filter)&&(state.tab==='live'?g.status==='live':state.tab==='today'?keyTR(g.date)===today:state.tab==='fixtures'?g.league==='gs'&&g.date>=new Date(now.getTime()-86400000):g.date>=new Date(now.getTime()-86400000)&&g.date<=weekEnd));$('#content').innerHTML='<div class="hint">'+escapeHtml(state.broadcastNote)+' <a href="https://www.ssportplus.com/yayin-akisi/" target="_blank" rel="noopener">${t().scheduleLink}</a></div>'+ (filtered.map(card).join('')||`<div class="empty">${t().empty}<br><br>${state.nbaError?'<span class="error">'+escapeHtml(state.nbaError)+'</span><br><br>':''}${t().missing}<p><a href="https://www.euroleaguebasketball.net/euroleague/games/" target="_blank">EuroLeague fikstürü ↗</a> · <a href="https://www.galatasaray.org/" target="_blank">Galatasaray ↗</a></p></div>`)}
function renderSettings(){let morning=localStorage.getItem('morning')||'09:00',lead=localStorage.getItem('lead')||'30';let enabled=localStorage.getItem('reminders-enabled')==='true';$('#content').innerHTML=`<div class="panel settings"><h3>${t().reminders}</h3><label class="reminder-switch"><input type="checkbox" id="reminders-enabled" ${enabled?'checked':''}> <strong>${t().reminderToggle}</strong></label><div id="reminder-options" ${enabled?'':'hidden'}><label>${t().morning} <select id="morning"><option>08:00</option><option>09:00</option><option>10:00</option></select></label><label>${t().before} <select id="lead"><option value="15">15 ${t().minutes}</option><option value="30">30 ${t().minutes}</option><option value="60">60 ${t().minutes}</option></select></label><button id="notify">${t().notify}</button><p class="hint">${t().notifyNote}</p></div><p id="reminder-off-note" class="hint" ${enabled?'hidden':''}>${t().reminderOff}</p></div><div class="panel"><h3>${t().links}</h3><p><a target="_blank" href="https://www.tvplus.com.tr/">TV+ aç ↗</a></p><p><a target="_blank" href="https://www.ssportplus.com/">S Sport Plus aç ↗</a></p><p><a target="_blank" href="https://www.todtv.com.tr/">TOD aç ↗</a></p><p class="hint">${t().channelNote}</p></div>`;$('#morning').value=morning;$('#lead').value=lead;$('#reminders-enabled').onchange=e=>{let on=e.target.checked;localStorage.setItem('reminders-enabled',String(on));$('#reminder-options').hidden=!on;$('#reminder-off-note').hidden=on};$('#morning').onchange=e=>localStorage.setItem('morning',e.target.value);$('#lead').onchange=e=>localStorage.setItem('lead',e.target.value);$('#notify').onclick=async()=>{if(!$('#reminders-enabled').checked)return;if(!('Notification'in window)){alert(t().unsupported);return}const p=await Notification.requestPermission();alert(t().permission+' '+p+' '+t().permissionNote)};}

document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{state.filter=b.dataset.filter;render()});setLanguage(lang);loadBroadcasts();render();getNBA();setInterval(getNBA,60000);
</script></body></html>
