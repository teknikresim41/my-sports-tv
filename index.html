const $=s=>document.querySelector(s), state={tab:'today',filter:'all',games:[],broadcasts:[],broadcastNote:'',nbaError:'',last:null};const langText={tr:{timezone:'🇹🇷 Türkiye saati',info:'Maç rehberim — Açıklama',description:'Bu rehber NBA, EuroLeague ve Galatasaray maçlarını, mümkün olduğunda canlı skorları ve doğrulanmış yayın kanallarını bir arada gösterir. TV+ üzerindeki S Sport 77. kanal, S Sport 2 ise 78. kanaldır. Bir maça dokunarak ilgili yayın platformuna veya maç sayfasına geçebilirsiniz.',disclaimer:'Önemli: NBA skorları internet bağlantısıyla yenilenir. Türk oyuncu işaretleri 2026–27 sezon başlangıç kadrosuna göredir; maçta oynayacakları garanti değildir. Galatasaray takımının açıklanmış Süper Lig ve Şampiyonlar Ligi fikstürü eklenmiştir; maç sonuçları otomatik güncellenmez. EuroLeague için tam otomatik fikstür/skor bağlantısı henüz yoktur. S Sport yayın bilgileri son doğrulanan kayıtları yansıtır; her gün otomatik güncellenmez. TV+ erişimi aboneliğinize bağlıdır. Hatırlatma saatleri kaydedilir, fakat arka plan bildirimleri henüz etkin değildir.',data:'Veri durumu',waiting:'Veri bekleniyor',checked:'Son kontrol: ',tabs:['Bugün','7 Gün','Canlı','Fikstür','Ayarlar'],filters:['Tümü','NBA','EuroLeague','Galatasaray','🇹🇷 Türk Oyunculu'],scheduleChecked:'Yayın akışı kontrol tarihi: ',offline:'Yayın akışı: 28 Ekim 2026 tarihli kayıtlar (çevrimdışı kopya).',scheduleLink:'Güncel S Sport yayın akışı ↗',live:'● CANLI',finished:'BİTTİ',scheduled:'Canlı yayın planı',replay:'Tekrar yayın',verified:'Yayın akışında',refresh:'Skorlar otomatik yenilenir',tvOpen:'TV+ aç ↗',matchPage:'Maç sayfası ↗',notVerified:'Yayın kanalı doğrulanmadı',empty:'Bu görünümde doğrulanmış maç bulunamadı.',missing:'Galatasaray için doğrulanmış fikstürü Fikstür sekmesinde bulunuyor. Maç sonuçları otomatik bağlı değil.',nbaError:'NBA veri servisine erişilemiyor.',nbaNone:'Bu tarihlerde NBA maçı bulunamadı.',reminders:'🔔 Hatırlatmalar',reminderToggle:'Hatırlatmaları etkinleştir',reminderOff:'Hatır Verified:'Channel not verified',empty:'No verified games found in this view.',missing:'Verified Galatasaray fixtures are available in the Fixtures tab. Live scores are not yet connected.',nbaError:'NBA data service unavailable.',nbaNone:'No NBA games found for these dates.',reminders:'🔔 Reminders',reminderToggle:'Enable reminders',reminderOff:'Reminders are off. Morning and pre-game alerts are disabled.',morning:'Morning summary:',before:'Before game:',minutes:'minutes',notify:'Request notification permission',notifyNote:'Reminder preferences are saved. Reliable alerts when your phone is locked require a server and push service; background alerts are not active yet.',links:'📺 Watch links',open:'open ↗',channelNote:'S Sport: TV+ 77 · S Sport 2: TV+ 78. This does not mean every game is broadcast on these channels.',unsupported:'This browser does not support notifications.',permission:'Notification permission:',permissionNote:'— automated notifications are not yet connected.'}};let lang='tr';try{lang=localStorage.getItem('sports-language')==='en'?'en':'tr'}catch(e){}const t=()=>langText[lang];function setLanguage(next){lang=next;state.broadcastNote=state.broadcasts.length?t().offline:'';localStorage.setItem('sports-language',lang);document.documentElement.lang=lang;$('#tr-btn').classList.toggle('active',lang==='tr');$('#en-btn').classList.toggle('active',lang==='en');$('#timezone-label').textContent=t().timezone;$('#info-heading').textContent=t().info;$('#info-toggle').setAttribute('aria-label',t().info);$('#info-toggle').title=t().info;$('#info-description').textContent=t().description;$('#info-disclaimer').textContent=t().disclaimer;$('#data-status-label').textContent=t().data;document.querySelectorAll('[data-tab]').forEach((b,i)=>b.textContent=t().tabs[i]);document.querySelectorAll('[data-filter]').forEach((b,i)=>b.textContent=t().filters[i]);render()}document.getElementById('tr-btn').onclick=()=>setLanguage('tr');document.getElementById('en-btn').onclick=()=>setLanguage('en');document.getElementById('info-toggle').onclick=()=>{const e=$('#info-body');e.hidden=!e.hidden;$('#info-toggle').setAttribute('aria-expanded',String(!e.hidden))};const TZ='Europe/Istanbul';const dateTR=d=>new Intl.DateTimeFormat('tr-TR',{timeZone:TZ,day:'2-digit',month:'short',weekday:'short'}).format(d);const timeTR=d=>new Intl.DateTimeFormat('tr-TR',{timeZone:TZ,hour:'2-digit',minute:'2-digit',hour12:false}).format(d);const keyTR=d=>new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}).format(d);const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const sourceLinks={nba:'https://www.nba.com/games',euro:'https://www.euroleaguebasketball.net/euroleague/games/',gs:'https://www.galatasaray.org/'};

const TURKISH_NBA_PLAYERS=[{team:'Houston Rockets',name:'Alperen Şengün'},{team:'Philadelphia 76ers',name:'Adem Bona'},{team:'Dallas Mavericks',name:'Tarık Biberović'}];function turkishPlayers(g){if(g.league!=='nba')return [];return TURKISH_NBA_PLAYERS.filter(p=>[g.home,g.away].some(team=>norm(team)===norm(p.team)||norm(team).includes(norm(p.team))));}

const norm=s=>String(s||'').toLocaleLowerCase('tr-TR').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
const broadcasterUrl='https://www.ssportplus.com/yayin-akisi/';
function loadBroadcasts(){const data=EMBEDDED_SCHEDULE;state.broadcasts=data.broadcasts||verifiedBroadcasts;state.broadcastNote=t().scheduleChecked+data.checkedAt;render()}
function broadcastGames(){return state.broadcasts.map((b,i)=>({id:'ss-'+i,league:b.league,date:new Date(b.date+'T'+b.time+':00+03:00'),home:b.title.split(/\s+-\s+/)[1]||'',away:b.title.split(/\s+-\s+/)[0]||b.title,status:'scheduled',detail:b.live?t().scheduled:t().replay,channel:b.channel+' · TV+ '+b.number,channelVerified:true,liveBroadcast:b.live,url:'https://tvplus.com.tr/',source:broadcasterUrl}))}

function galatasarayGames(){return GS_FIXTURES.map((g,i)=>({id:'gs-'+i,league:'gs',date:new Date(g.date+'T'+g.time+':00+03:00'),away:g.away,home:g.home,status:'scheduled',detail:g.competition,channel:t().notVerified,channelVerified:false,url:'https://www.galatasaray.org/'}))}
function combinedGames(){const all=state.games.concat(galatasarayGames()).map(g=>{const b=matchBroadcast(g);return b?{...g,channel:b.channel+' · TV+ '+b.number,channelVerified:true,liveBroadcast:b.live,source:broadcasterUrl,url:'https://tvplus.com.tr/'}:g});const known=new Set(all.filter(g=>g.channelVerified).map(g=>norm(g.away+' '+g.home)+keyTR(g.date)));return all.concat(broadcastGames().filter(g=>!known.has(norm(g.away+' '+g.home)+keyTR(g.date)))).sort((a,b)=>a.date-b.date)}

async function getNBA(){let games=[];let errors=[];for(let offset=-1;offset<=7;offset++){const d=new Date(Date.now()+offset*86400000);const ymd=new Intl.DateTimeFormat('en-CA',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit'}).format(d).replaceAll('-','');try{const ctrl=new AbortController();const timeout=setTimeout(()=>ctrl.abort(),6500);const r=await fetch('https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard?dates='+ymd,{signal:ctrl.signal});clearTimeout(timeout);if(!r.ok)throw Error('HTTP '+r.status);const data=await r.json();for(const e of data.events||[]){const c=e.competitions?.[0];const teams=c?.competitors||[];const home=teams.find(t=>t.homeAway==='home'),away=teams.find(t=>t.homeAway==='away');if(!home||!away)continue;const st=e.status?.type||{};games.push({id:e.id,league:'nba',date:new Date(e.date),home:home.team?.displayName||'',away:away.team?.displayName||'',homeScore:home.score,awayScore:away.score,status:st.state==='in'?'live':st.completed?'final':'scheduled',detail:e.status?.displayClock&&st.state==='in'?(e.status.period+'. Çeyrek · '+e.status.displayClock):st.shortDetail||'',channel:t().notVerified,url:sourceLinks.nba})}}catch(e){errors.push(e.message)}}state.nbaError=games.length?'':errors.length?t().nbaError:t().nbaNone;state.games=[...new Map(games.map(g=>[g.id,g])).values()].sort((a,b)=>a.date-b.date);state.last=new Date();render()}
function card(g){return `<article class="panel"><div class="top"><span class="league">${g.league==='nba'?'🏀 NBA':g.league==='euro'?'🏀 EUROLEAGUE':'⚽ GALATASARAY · '+escapeHtml(g.detail)}</span><span class="${g.status==='live'?'live':'meta'}">${g.status==='live'?t().live+' · '+escapeHtml(g.detail):g.status==='final'?t().finished:'🕒 '+dateTR(g.date)+' '+timeTR(g.date)}</span></div><div class="match"><div class="teams">${escapeHtml(g.away)}<br>${escapeHtml(g.home)}</div><div class="score">${g.status==='scheduled'?'–':escapeHtml(g.awayScore)+' – '+escapeHtml(g.homeScore)}</div></div>${turkishPlayers(g).map(p=>`<div class="turkish-player"><span>🇹🇷</span><strong>${escapeHtml(p.name)}</strong><span class="player-team">${escapeHtml(p.team)}</span></div>`).join('')}<div class="channel">📺 ${escapeHtml(g.channel)} ${g.channelVerified?'<span class="tag">'+t().verified+'</span>':''}</div><div class="action"><span class="meta">${g.status==='live'?t().refresh:escapeHtml(g.detail)}</span><a href="${g.url}" target="_blank" rel="noopener noreferrer">${g.channelVerified?t().tvOpen:t().matchPage}</a></div></article>`}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab));document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('active',b.dataset.filter===state.filter));$('.filters').style.display=state.tab==='settings'?'none':'flex';$('#updated').textContent=state.last?t().checked+timeTR(state.last):t().waiting;if(state.tab==='settings'){renderSettings();return}const now=new Date(),today=keyTR(now),weekEnd=new Date(now.getTime()+7*86400000);const filtered=combinedGames().filter(g=>(state.filter==='all'||(state.filter==='turkish'?turkishPlayers(g).length>0:g.league===state.filter))&&(state.tab==='live'?g.status==='live':state.tab==='today'?keyTR(g.date)===today:state.tab==='fixtures'?g.league==='gs'&&g.date>=new Date(now.getTime()-86400000):g.date>=new Date(now.getTime()-86400000)&&g.date<=weekEnd));$('#content').innerHTML='<div class="hint">'+escapeHtml(state.broadcastNote)+' <a href="https://www.ssportplus.com/yayin-akisi/" target="_blank" rel="noopener">${t().scheduleLink}</a></div>'+ (filtered.map(card).join('')||`<div class="empty">${t().empty}<br><br>${state.nbaError?'<span class="error">'+escapeHtml(state.nbaError)+'</span><br><br>':''}${t().missing}<p><a href="https://www.euroleaguebasketball.net/euroleague/games/" target="_blank">EuroLeague fikstürü ↗</a> · <a href="https://www.galatasaray.org/" target="_blank">Galatasaray ↗</a></p></div>`)}
function renderSettings(){let morning=localStorage.getItem('morning')||'09:00',lead=localStorage.getItem('lead')||'30';let enabled=localStorage.getItem('reminders-enabled')==='true';$('#content').innerHTML=`<div class="panel settings"><h3>${t().reminders}</h3><label class="reminder-switch"><input type="checkbox" id="reminders-enabled" ${enabled?'checked':''}> <strong>${t().reminderToggle}</strong></label><div id="reminder-options" ${enabled?'':'hidden'}><label>${t().morning} <select id="morning"><option>08:00</option><option>09:00</option><option>10:00</option></select></label><label>${t().before} <select id="lead"><option value="15">15 ${t().minutes}</option><option value="30">30 ${t().minutes}</option><option value="60">60 ${t().minutes}</option></select></label><button id="notify">${t().notify}</button><p class="hint">${t().notifyNote}</p></div><p id="reminder-off-note" class="hint" ${enabled?'hidden':''}>${t().reminderOff}</p></div><div class="panel"><h3>${t().links}</h3><p><a target="_blank" href="https://www.tvplus.com.tr/">TV+ aç ↗</a></p><p><a target="_blank" href="https://www.ssportplus.com/">S Sport Plus aç ↗</a></p><p><a target="_blank" href="https://www.todtv.com.tr/">TOD aç ↗</a></p><p class="hint">${t().channelNote}</p></div>`;$('#morning').value=morning;$('#lead').value=lead;$('#reminders-enabled').onchange=e=>{let on=e.target.checked;localStorage.setItem('reminders-enabled',String(on));$('#reminder-options').hidden=!on;$('#reminder-off-note').hidden=on};$('#morning').onchange=e=>localStorage.setItem('morning',e.target.value);$('#lead').onchange=e=>localStorage.setItem('lead',e.target.value);$('#notify').onclick=async()=>{if(!$('#reminders-enabled').checked)return;if(!('Notification'in window)){alert(t().unsupported);return}const p=await Notification.requestPermission();alert(t().permission+' '+p+' '+t().permissionNote)};}


// TV guide is deliberately separate from the match guide. The official broadcaster
// website is the source of truth; never invent schedule entries when it is inaccessible.
const tvState={open:false,section:'ssport',channel:'ssport',day:0};
const tvUrl='https://www.ssport.tv/yayin-akisi';
const tvChannels=[['TRT 1','https://www.trt1.com.tr/yayin-akisi'],['TRT Spor','https://www.trtspor.com.tr/yayin-akisi'],['ATV','https://www.atv.com.tr/yayin-akisi'],['A Spor','https://www.aspor.com.tr/yayin-akisi'],['TV8','https://www.tv8.com.tr/yayin-akisi'],['TV8,5','https://www.tv8bucuk.com/yayin-akisi']];
function tvDate(n){let d=new Date();d.setDate(d.getDate()+n);return new Intl.DateTimeFormat(lang==='en'?'en-GB':'tr-TR',{timeZone:'Europe/Istanbul',day:'numeric',month:'long',weekday:'long'}).format(d)}
const TV_SCHEDULE_DATE='2026-10-28';
const TV_SCHEDULE={ssport:[['00:30','Bayern Münih - Baskonia','EuroLeague'],['02:30','NBA Özetler',''],['03:00','Detroit Pistons - New York Knicks','NBA · CANLI'],['05:30','World of Free Sports',''],['06:00','Dünyanın Futbolu',''],['07:00','İspanya LaLiga',''],['09:00','2. Bundesliga','Geniş Özetler'],['09:30','NBA',''],['11:30','Moto 2','Avustralya'],['12:30','İspanya LaLiga',''],['14:30','NBA Özetler',''],['15:00','EuroLeague',''],['17:00','NBA',''],['19:00','Hollanda Ligi','Geniş Özetler'],['19:45','Maça Doğru','CANLI'],['20:30','Beşiktaş - Olympiacos','EuroLeague · CANLI'],['22:30','Özetler',''],['22:45','Genoa - Juventus','Serie A · CANLI']],ssport2:[['00:45','Panathinaikos - Olimpia Milano','EuroLeague'],['02:45','Super Cars 2026',''],['04:00','Moto GP',''],['05:00','İtalya Serie A',''],['07:00','EuroLeague',''],['09:00','Dünyanın Futbolu',''],['10:00','İtalya Serie A',''],['12:00','NBA',''],['14:00','Hollanda Ligi','Geniş Özetler'],['15:00','Moto GP',''],['16:00','NBA Özetler',''],['16:30','İtalya Serie A',''],['18:30','EuroLeague',''],['20:30','2. Bundesliga',''],['23:00','Venezia - Inter','Serie A']]};
function renderTV(){const en=lang==='en';$('#content').classList.toggle('tv-hidden',tvState.open);$('.filters').classList.toggle('tv-hidden',tvState.open);document.querySelector('.tabs').classList.toggle('tv-hidden',tvState.open);document.querySelector('.data-footer').classList.toggle('tv-hidden',tvState.open);$('#tv-screen').classList.toggle('tv-hidden',!tvState.open);$('#tv-entry').textContent=tvState.open?(en?'← Back':'← Geri'):'📺 TV';if(!tvState.open)return;
const sport=tvState.section==='ssport';const today=keyTR(new Date());const isCurrent=today===TV_SCHEDULE_DATE;const entries=TV_SCHEDULE[tvState.channel];$('#tv-screen').innerHTML=`<h2>📺 ${en?'TV Guide':'TV Rehberi'}</h2><div class="tv-switch"><button data-tv-section="ssport" class="${sport?'active':''}">${en?'S Sport Full Schedule':'S Sport Tam Yayın Akışı'}</button><button data-tv-section="other" class="${!sport?'active':''}">${en?'Other Channels · Matches':'Diğer Kanallar · Maçlar'}</button></div>${sport?`<div class="tv-switch"><button data-tv-channel="ssport" class="${tvState.channel==='ssport'?'active':''}">S Sport · TV+ 77</button><button data-tv-channel="ssport2" class="${tvState.channel==='ssport2'?'active':''}">S Sport 2 · TV+ 78</button></div><section class="panel"><h3>${tvState.channel==='ssport'?'S Sport':'S Sport 2'} — 28 ${en?'October':'Ekim'} 2026</h3><p class="tv-notice">${isCurrent?(en?'Today’s schedule (Türkiye time). Schedule changes may occur.':'Bugünün yayın akışı (Türkiye saati). Son dakika değişiklikleri olabilir.'):(en?'ARCHIVE: This schedule is for 28 October 2026, not today.':'ARŞİV: Bu yayın akışı 28 Ekim 2026 tarihine aittir; bugünün programı değildir.')}</p><div class="tv-program-list">${entries.map(([time,name,detail])=>`<div class="tv-item" style="align-items:flex-start;gap:12px"><strong style="min-width:48px;font-variant-numeric:tabular-nums">${time}</strong><div style="flex:1"><strong>${escapeHtml(name)}</strong>${detail?`<div class="meta">${escapeHtml(detail)}</div>`:''}</div>${detail.includes('CANLI')?'<span class="tag">CANLI</span>':''}</div>`).join('')}</div><p class="hint">${en?'Source: S Sport official broadcast guide; S Sport 2 schedule cross-checked against published listings.':'Kaynak: S Sport resmî yayın akışı; S Sport 2 yayımlanmış program listeleriyle karşılaştırılmıştır.'}</p></section>`:`<section class="panel"><h3>${en?'Live matches on other channels':'Diğer kanallardaki canlı maçlar'}</h3><p class="tv-notice">${en?'A verified live-match feed is not yet connected.':'Diğer kanallar için doğrulanmış canlı maç veri bağlantısı henüz kurulmadı.'}</p>${tvChannels.map(([name,url])=>`<div class="tv-item"><strong class="tv-name">${name}</strong><span class="meta">${en?'Not connected':'Veri bağlantısı yok'}</span></div>`).join('')}</section>`}`;
$('#tv-screen').querySelectorAll('[data-tv-section]').forEach(b=>b.onclick=()=>{tvState.section=b.dataset.tvSection;renderTV()});$('#tv-screen').querySelectorAll('[data-tv-channel]').forEach(b=>b.onclick=()=>{tvState.channel=b.dataset.tvChannel;renderTV()});}
document.querySelectorAll('#tr-btn,#en-btn').forEach(b=>b.addEventListener('click',()=>renderTV()));
$('#tv-entry').onclick=()=>{tvState.open=!tvState.open;renderTV()};

document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{state.filter=b.dataset.filter;render()});setLanguage(lang);renderTV();loadBroadcasts();render();getNBA();setInterval(getNBA,60000);
</script></body></html>
