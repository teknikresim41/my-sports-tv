name: Update TV matches
on:
  workflow_dispatch:
  schedule:
    - cron: '15 5,11,17 * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python scripts/update_tv.py
      - name: Commit new guide
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tv-matches.json
          git diff --cached --quiet || (git commit -m 'Update TV match guide' && git push)

